name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Test with coverage
        run: yarn test:coverage

      - name: Verify package contents
        run: yarn pack:check

      - name: Audit production dependencies
        run: yarn audit --groups dependencies

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

  release:
    needs: [quality, compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Release
        run: npx --yes --package=semantic-release@25.0.9 --package=@semantic-release/changelog@7.0.0 --package=@semantic-release/git@11.0.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update v1 major tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_tag="$(git tag --list 'v1.*.*' --sort=-version:refname | sed -n '1p')"
          if [[ -z "$release_tag" ]]; then
            echo "No v1 release tag found; leaving the v1 major tag unchanged."
            exit 0
          fi

          release_sha="$(git rev-list -n 1 "$release_tag")"
          current_sha="$(git rev-parse --verify 'refs/tags/v1^{}' 2>/dev/null || true)"
          if [[ "$current_sha" == "$release_sha" ]]; then
            echo "v1 already points to $release_tag ($release_sha)."
            exit 0
          fi

          if [[ -n "$current_sha" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1" \
              -f sha="$release_sha" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v1' \
              -f sha="$release_sha" >/dev/null
          fi

          echo "Updated v1 to $release_tag ($release_sha)."
