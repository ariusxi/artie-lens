name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update v1 major tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_tag="$(git tag --list 'v1.*.*' --sort=-version:refname | sed -n '1p')"
          if [[ -z "$release_tag" ]]; then
            echo "No v1 release tag found; leaving the v1 major tag unchanged."
            exit 0
          fi

          release_sha="$(git rev-list -n 1 "$release_tag")"
          current_sha="$(git rev-parse --verify 'refs/tags/v1^{}' 2>/dev/null || true)"
          if [[ "$current_sha" == "$release_sha" ]]; then
            echo "v1 already points to $release_tag ($release_sha)."
            exit 0
          fi

          if [[ -n "$current_sha" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1" \
              -f sha="$release_sha" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v1' \
              -f sha="$release_sha" >/dev/null
          fi

          echo "Updated v1 to $release_tag ($release_sha)."
